<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thorpe SHANKERS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shankers">
<meta name="theme-color" content="#122341">
<style>
/* Thorpe SHANKERS. The Clubhouse Board (from NTRC / FF Tour): ivory paper, navy chrome,
   gold detail, Charter serif. Scaled for older eyes: everything in rem off an 18px base
   (bigger with "Writing size"), buttons 56px+ and well apart, strong contrast. */
:root{
  --paper:#f7f4ec; --card:#fffefa; --ink:#14203a; --navy:#122341; --navy2:#1a2f54;
  --mut:#4f4a3f; --faint:#6e685a; --hair:#ddd5c1; --hair2:#c3b99c;
  --gold:#8a6a22; --gold-pale:#e2d19f; --gold-wash:rgba(168,134,60,.10);
  --green:#2e5a35; --green-wash:#e6efe4; --red:#9a1f2e; --red-wash:#f8e6e6; --amber:#7a5200; --amber-wash:#fbf0d6;
  --serif:"Charter","Bitstream Charter","Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tap:max(56px,3.2rem);
}
html{font-size:18px;-webkit-text-size-adjust:100%;background:var(--navy);}
html.big1{font-size:21px;} html.big2{font-size:24px;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1rem;
  -webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;overscroll-behavior-y:contain;}
button,input,select{font:inherit;color:inherit;}
.hide{display:none!important;}

/* chrome */
.chrome{position:sticky;top:0;z-index:20;background:var(--navy);color:#f4f1e8;
  box-shadow:0 2px 10px rgba(18,35,65,.25);padding-top:env(safe-area-inset-top,0px);}
.chrome-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.7rem 1rem .7rem;}
.brand{font-family:var(--serif);font-weight:700;font-size:1.15rem;letter-spacing:.03em;}
.mono-h{height:1.7rem;width:auto;color:var(--gold-pale);flex:none;}
.flag{background:var(--gold-pale);color:var(--navy);text-align:center;font-size:.85rem;font-weight:700;padding:.4rem 1rem;}
.flag.off{background:var(--red);color:#fff;font-size:1rem;padding:.7rem 1rem;}
.wrap{max-width:760px;margin:0 auto;padding:1.3rem max(16px,env(safe-area-inset-left,0px)) calc(7rem + env(safe-area-inset-bottom,0px));}

/* bottom bar: words, not icons */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);
  padding:.35rem .35rem calc(.35rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:.3rem;
  box-shadow:0 -2px 10px rgba(18,35,65,.2);}
.nav button{flex:1;max-width:9rem;min-height:var(--tap);background:none;border:0;border-radius:6px;cursor:pointer;
  color:#e9e4d6;font-size:.9rem;font-weight:600;padding:.2rem;}
.nav button.on{background:rgba(226,209,159,.16);color:var(--gold-pale);box-shadow:inset 0 -3px 0 var(--gold-pale);}

/* headings */
.h1{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:1.75rem;line-height:1.15;margin:.2rem 0 .3rem;text-align:center;}
.h2{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:1.35rem;margin:2rem 0 .6rem;
  padding-bottom:.35rem;border-bottom:2px solid var(--navy);}
.h2 small{font-family:var(--sans);font-weight:500;font-size:.85rem;color:var(--mut);margin-left:.4rem;}
.sub{text-align:center;color:var(--mut);font-size:1rem;margin:0 0 1rem;}
.rule{display:flex;align-items:center;gap:.8rem;margin:.6rem auto 1rem;max-width:18rem;}
.rule span{flex:1;height:1px;background:var(--hair2);} .rule em{font-family:var(--serif);font-style:normal;color:var(--gold);letter-spacing:.2em;}
p{margin:.5rem 0;} .mut{color:var(--mut);} .small{font-size:.9rem;}
.note{color:var(--mut);font-size:.95rem;margin:.6rem 0;}

/* the week panel */
.panel{background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:1rem;margin:0 0 1rem;}
.panel.navy{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#f4f1e8;border:0;
  box-shadow:inset 0 0 0 1px rgba(217,200,154,.5),inset 0 0 0 5px var(--navy),inset 0 0 0 6px rgba(217,200,154,.22);padding:1.2rem 1.1rem;}
.panel.navy .kick{color:var(--gold-pale);}
.kick{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--gold);}
.wk-t{font-family:var(--serif);font-weight:700;font-size:1.4rem;line-height:1.2;margin:.15rem 0;}
.wk-f{font-size:1rem;}
.panel.navy .wk-f{color:#e9e4d6;}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:var(--tap);margin:.75rem 0;
  border-radius:8px;border:2px solid var(--navy);background:var(--card);color:var(--navy);
  font-size:1.05rem;font-weight:700;cursor:pointer;padding:.5rem 1rem;text-align:center;text-decoration:none;line-height:1.25;}
.btn.main{background:var(--gold-pale);border-color:var(--gold-pale);color:var(--navy);font-size:1.25rem;min-height:calc(var(--tap) + 12px);
  box-shadow:0 3px 0 rgba(0,0,0,.25);}
.panel:not(.navy) .btn.main,.wrap > .btn.main{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.go{background:var(--navy);color:#fff;}
.btn.warn{border-color:var(--red);color:var(--red);}
.btn.quiet{border-color:var(--hair2);color:var(--mut);font-weight:600;}
.btn.back{width:auto;display:inline-flex;min-height:var(--tap);margin:0 0 .6rem;padding:.4rem 1rem;border-color:var(--hair2);color:var(--navy);}
.btn[disabled]{opacity:.45;cursor:default;}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;} .btns2 .btn{margin:.4rem 0;}
.link{background:none;border:0;color:var(--navy);text-decoration:underline;text-underline-offset:3px;font-size:1rem;
  cursor:pointer;padding:.8rem .2rem;min-height:var(--tap);font-weight:600;}

/* leaderboard */
.lb{border-top:2px solid var(--navy);margin:0;}
.row{display:grid;grid-template-columns:2.6rem 1fr auto;gap:.6rem;align-items:center;padding:.75rem .3rem;
  border-bottom:1px solid var(--hair);min-height:var(--tap);}
.row.tap{cursor:pointer;}
.row.win{background:var(--gold-wash);}
.pos{font-family:var(--serif);font-weight:700;font-size:1.15rem;text-align:center;color:var(--mut);}
.row.win .pos{color:var(--gold);}
.nm{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--navy);line-height:1.25;min-width:0;}
.nm .meta{display:block;font-family:var(--sans);font-weight:400;font-size:.9rem;color:var(--mut);margin-top:.1rem;}
.sc{font-family:var(--serif);font-weight:700;font-size:1.5rem;color:var(--navy);text-align:right;line-height:1.1;font-variant-numeric:tabular-nums lining-nums;}
.sc small{display:block;font-family:var(--sans);font-size:.75rem;font-weight:600;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;}
.cbn{display:inline-block;margin-top:.25rem;font-size:.8rem;font-family:var(--sans);font-weight:600;color:var(--gold);
  border:1px solid var(--gold-pale);border-radius:4px;padding:0 .35rem;background:#fff;}
.prz{display:grid;gap:.6rem;margin:.4rem 0 .4rem;}
.prz-r{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:baseline;padding:.7rem .9rem;border-radius:8px;background:var(--gold-wash);border:1px solid var(--gold-pale);}
.prz-r b{font-family:var(--serif);font-size:1.15rem;color:var(--navy);}
.prz-r .what{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold);display:block;}
.prz-r .amt{font-family:var(--serif);font-weight:700;font-size:1.2rem;color:var(--green);}
.missing{color:var(--mut);font-size:1rem;margin:.6rem 0;}
.empty{color:var(--mut);text-align:center;padding:1.4rem .5rem;font-family:var(--serif);font-style:italic;font-size:1.1rem;}

/* tables */
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums lining-nums;}
table.t th{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:.5rem .35rem;
  border-bottom:2px solid var(--navy);text-align:center;}
table.t th:nth-child(2),table.t td:nth-child(2){text-align:left;}
table.t td{padding:.65rem .35rem;border-bottom:1px solid var(--hair);text-align:center;font-size:1.05rem;}
table.t td.n{font-family:var(--serif);font-weight:700;color:var(--navy);}
table.t td.p{font-family:var(--serif);font-weight:700;font-size:1.2rem;color:var(--navy);}
table.t tr.me td{background:var(--gold-wash);}

/* card entry */
.hline{text-align:center;font-size:1.05rem;color:var(--navy);margin:.2rem 0 .2rem;}
.hline .link{min-height:var(--tap);padding:.6rem .4rem;}
.fmt{text-align:center;font-size:1.15rem;font-weight:700;color:var(--navy);background:var(--gold-wash);border:2px solid var(--gold-pale);
  border-radius:8px;padding:.7rem;margin:.6rem 0 1rem;}
.fmt b{text-transform:uppercase;letter-spacing:.06em;}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.box{display:block;text-align:center;}
.box span{display:block;font-family:var(--serif);font-weight:700;font-size:1.3rem;color:var(--navy);}
.box span small{display:block;font-family:var(--sans);font-weight:500;font-size:.85rem;color:var(--mut);}
.box input{width:100%;height:5rem;margin-top:.35rem;text-align:center;font-family:var(--serif);font-weight:700;font-size:2.6rem;
  border:3px solid var(--navy);border-radius:10px;background:#fff;color:var(--ink);padding:0;-moz-appearance:textfield;}
.box input::-webkit-outer-spin-button,.box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.box input:focus{outline:4px solid var(--gold-pale);outline-offset:1px;}
.tot{text-align:center;margin:1.1rem 0 .4rem;font-family:var(--serif);color:var(--navy);}
.tot b{display:block;font-size:3rem;line-height:1.05;font-variant-numeric:lining-nums;}
.tot span{font-size:1.15rem;font-weight:700;}
.hint{border-radius:8px;padding:.7rem .9rem;margin:.6rem 0;font-size:1rem;background:var(--amber-wash);color:var(--amber);border:1px solid #e6cf91;font-weight:600;}
.state{border-radius:10px;padding:1rem;margin:1rem 0;text-align:center;font-size:1.3rem;font-weight:800;border:3px solid;}
.state.ok{background:var(--green-wash);color:var(--green);border-color:var(--green);}
.state.wait{background:var(--amber-wash);color:var(--amber);border-color:#d4ad4e;}
.state.no{background:var(--red-wash);color:var(--red);border-color:var(--red);}
.state.none{background:#fff;color:var(--mut);border-color:var(--hair2);font-weight:600;font-size:1.1rem;}
.state small{display:block;font-size:.95rem;font-weight:600;margin-top:.25rem;}

/* pickers and forms */
.who{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:.8rem 0;}
.who button{min-height:var(--tap);border:2px solid var(--hair2);background:var(--card);border-radius:8px;cursor:pointer;
  font-family:var(--serif);font-weight:700;font-size:1.1rem;color:var(--navy);padding:.4rem;line-height:1.2;}
.who button.done{border-color:var(--green);background:var(--green-wash);}
.who button small{display:block;font-family:var(--sans);font-weight:500;font-size:.8rem;color:var(--mut);}
.fld{display:block;margin:0 0 1rem;}
.fld > span{display:block;font-weight:700;color:var(--navy);margin-bottom:.3rem;font-size:1rem;}
.fld input,.fld select{width:100%;min-height:var(--tap);font-size:1.1rem;padding:.4rem .7rem;border:2px solid var(--hair2);border-radius:8px;background:#fff;}
.fld input:focus,.fld select:focus{outline:3px solid var(--gold-pale);border-color:var(--navy);}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:.3rem 0 1rem;}
.choice button{min-height:var(--tap);border:2px solid var(--hair2);background:#fff;border-radius:8px;font-weight:700;cursor:pointer;padding:.4rem;line-height:1.2;}
.choice button.on{border-color:var(--navy);background:var(--navy);color:#fff;}
.tick{display:grid;grid-template-columns:1fr 5.2rem;gap:.6rem;align-items:center;border-bottom:1px solid var(--hair);padding:.35rem 0;}
.tick button{min-height:var(--tap);text-align:left;border:2px solid var(--hair2);background:#fff;border-radius:8px;padding:.3rem .8rem;
  font-family:var(--serif);font-weight:700;font-size:1.1rem;color:var(--navy);cursor:pointer;}
.tick button.on{border-color:var(--green);background:var(--green-wash);}
.tick button.on::before{content:"✓ ";color:var(--green);}
.tick input{min-height:var(--tap);width:100%;text-align:center;font-size:1.1rem;border:2px solid var(--hair2);border-radius:8px;}
.tick label{font-size:.75rem;color:var(--mut);text-align:center;display:block;}
.chk{border-bottom:1px solid var(--hair);padding:.7rem 0;display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:center;}
.chk .nm{font-size:1.05rem;}
.chk .tag{font-size:.85rem;font-weight:700;border-radius:4px;padding:.15rem .5rem;white-space:nowrap;}
.tag.in{background:var(--green-wash);color:var(--green);} .tag.out{background:#eee9dc;color:var(--mut);} .tag.odd{background:var(--amber-wash);color:var(--amber);}
.paid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.4rem;grid-column:1/-1;}
.paid button{min-height:var(--tap);border:2px solid var(--hair2);background:#fff;border-radius:8px;font-weight:700;cursor:pointer;font-size:.95rem;}
.paid button.on{border-color:var(--green);background:var(--green);color:#fff;}
.cbbox{background:var(--amber-wash);border:2px solid #d4ad4e;border-radius:8px;padding:.9rem;margin:.8rem 0;}
.cbbox h4{margin:0 0 .3rem;font-size:1.05rem;color:var(--amber);}
.cbrow{display:grid;grid-template-columns:1fr 4.6rem 4.6rem;gap:.5rem;align-items:center;margin:.4rem 0;}
.cbrow input{min-height:var(--tap);width:100%;text-align:center;font-size:1.2rem;font-weight:700;border:2px solid var(--hair2);border-radius:8px;}
.cbrow .lab{font-size:.75rem;text-align:center;color:var(--mut);font-weight:700;}

/* money */
.bal{font-family:var(--serif);font-weight:700;font-size:1.15rem;}
.bal.owes{color:var(--red);} .bal.cred{color:var(--green);} .bal.zero{color:var(--mut);}
.led{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;padding:.55rem 0;border-bottom:1px solid var(--hair);font-size:1rem;}
.led .d{font-size:.85rem;color:var(--mut);}
.led .a{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
.led .x{grid-column:1/-1;}
.tots{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;font-size:1.05rem;}
.tots b{text-align:right;font-variant-numeric:tabular-nums;}

/* history */
.hist{border-bottom:1px solid var(--hair);padding:.7rem 0;}
.hist .v{font-family:var(--serif);font-weight:700;font-size:1.2rem;color:var(--navy);}

/* the saving queue */
.qbar{border-radius:8px;padding:.7rem .9rem;margin:0 0 1rem;font-weight:700;font-size:1rem;}
.qbar.wait{background:var(--amber-wash);color:var(--amber);border:2px solid #d4ad4e;}
.qbar.no{background:var(--red-wash);color:var(--red);border:2px solid var(--red);}
.qbar ul{margin:.3rem 0 0;padding-left:1.1rem;font-weight:500;}

/* add to home screen pictures */
.a2-step{display:grid;grid-template-columns:2.2rem 1fr;gap:.7rem;align-items:start;margin:.9rem 0;}
.a2-n{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;}
.a2-pic{margin-top:.5rem;border:1px solid var(--hair2);border-radius:10px;background:#fff;padding:.6rem;max-width:18rem;}
.a2-pic svg{display:block;width:100%;height:auto;}

/* splash */
#splash{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:2rem 1.2rem calc(2rem + env(safe-area-inset-bottom,0px));overflow-y:auto;
  transition:opacity .6s ease,visibility .6s;}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none;}
#splash .in{width:min(26rem,100%);}
#splash .in > *{opacity:0;transform:translateY(7px);animation:spIn .8s cubic-bezier(.22,.61,.36,1) forwards;}
@keyframes spIn{to{opacity:1;transform:none;}}
.sp-mono{width:min(9rem,40vw);height:auto;color:var(--navy);animation-delay:.1s;}
.sp-t{font-family:var(--serif);font-weight:700;color:var(--navy);line-height:1.05;font-size:2.6rem;margin-top:.8rem;animation-delay:.2s;}
.sp-tag{font-family:var(--serif);font-style:italic;color:var(--mut);font-size:1.05rem;margin-top:.4rem;animation-delay:.35s;}
.sp-hi{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:1.4rem;margin-top:1.4rem;animation-delay:.45s;}
#splash .btn{animation-delay:.55s;}
#splash .who{animation-delay:.55s;}
.sp-q{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:1.35rem;margin-top:1.4rem;animation-delay:.5s;}
#splash2{position:fixed;inset:0;z-index:59;background:#000;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);transition:opacity .6s ease,visibility .6s;}
#splash2.gone{opacity:0;visibility:hidden;pointer-events:none;}
#splash2 img{flex:1 1 auto;min-height:0;max-width:100%;max-height:calc(100% - 3rem);object-fit:contain;}
#splash2 .s2-e{margin-top:.8rem;font-size:1rem;color:rgba(255,255,255,.75);}
@media(prefers-reduced-motion:reduce){ #splash .in > *{animation:none;opacity:1;transform:none;} }

#toast{position:fixed;left:50%;bottom:calc(6rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);z-index:58;
  background:var(--navy);color:#fff;font-size:1rem;font-weight:700;padding:.7rem 1.2rem;border-radius:999px;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 4px 16px rgba(28,39,64,.22);max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translate(-50%,0);}
.foot{text-align:center;margin-top:2.5rem;font-size:.8rem;color:var(--faint);}

/* stats */
.h3{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:1.15rem;margin:1.4rem 0 .4rem;}
.choice.srt,.choice.wx,.choice.yrs{grid-template-columns:1fr 1fr 1fr;}
.choice button{color:var(--navy);font-size:1rem;}
.choice button.on{color:#fff;}
table.t tr.tap{cursor:pointer;}
table.t td .meta{display:block;font-family:var(--sans);font-weight:400;font-size:.8rem;color:var(--mut);margin-top:.15rem;line-height:1.3;}
table.t td:first-child{color:var(--mut);font-weight:700;width:1.6rem;padding-left:0;}
table.st td{font-size:1rem;}
table.st td:nth-child(n+4){white-space:nowrap;}
.neg{color:var(--red);font-weight:700;} .pos2{color:var(--green);font-weight:700;}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.6rem 0 1rem;}
.tiles>div{background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:.6rem .4rem;text-align:center;font-size:.85rem;color:var(--mut);line-height:1.3;}
.tiles b{display:block;font-family:var(--serif);font-size:1.6rem;color:var(--navy);line-height:1.15;font-variant-numeric:lining-nums;}
.chart{margin:.4rem 0 1rem;}
.chart svg{display:block;width:100%;height:auto;overflow:visible;}
.chart .gl{stroke:var(--hair);stroke-width:1;}
.chart .ax{font-size:11px;fill:var(--mut);font-family:var(--sans);}
.chart .avg{stroke:var(--gold);stroke-width:2;stroke-dasharray:4 4;}
.chart .bar path{fill:var(--navy2);}
.chart .bar .hit{fill:transparent;cursor:pointer;}
.chart .bar.on path{fill:var(--gold);}
.tbinfo{font-size:.95rem;color:var(--mut);text-align:center;margin-top:.4rem;min-height:2.6em;}
.tbinfo b{color:var(--navy);}
table.av td:nth-child(4){width:48%;}
.mbar{display:flex;align-items:center;gap:.4rem;}
.mbar i{display:block;height:.9rem;background:var(--navy2);border-radius:0 4px 4px 0;min-width:2px;}
.mbar b{font-family:var(--serif);color:var(--navy);}
table.wl td{font-size:.95rem;}
table.wl td.small{font-size:.85rem;}
.tiles small{display:block;font-size:.8rem;margin-top:.1rem;}
.lb .row.me{background:var(--gold-wash);}

<script>
"use strict";
/* Thorpe SHANKERS: the weekly roll-up. One app for everyone.
   Players put in cards (theirs or their group's) and set their own nickname. The admin,
   with the admin PIN, does everything else, all inside this app on a phone.

   Saving: every change is a small op ({op, path, value}) sent to the relay (worker/worker.js),
   never the whole document (the NTRC v38 lesson). Changes show at once, queue on the phone
   while there's no signal, retry by themselves, and say plainly whether they're saved. */
const CFG = {"app_name": "Thorpe SHANKERS", "short_name": "Shankers", "monogram": "TS", "tagline": "Every Saturday. Front 9, back 9, overall.", "jibes": ["…and a hokey cokey. You put your front 9 in, your back 9 out.", "Where the handicaps go up and the stories get longer.", "Ten pounds well spent. Mostly by other people.", "Out in 18, back in 12, in the bar by 1.", "Every Saturday. Every excuse.", "Home of the 4-foot gimme and the 40-yard shank.", "Grip it and grumble.", "The course is long. The countback is longer."], "version": "4.3", "built_by": "Justin Lawrence", "admin_by": "Kevin Ford", "admin_name": "Kevin Ford", "github_owner": "", "repo": "THORPESHANKERS", "live_url": "https://jekylgithub.github.io/THORPESHANKERS/", "worker_url": "https://thorpeshankers-relay.jklmac.workers.dev", "season_start": "", "admins": ["justin", "kevin"]};
const BASE = {"settings": {"twos": 0, "prizes": {"overall": 50, "front": 25, "back": 25}, "course": "Thorpe Hall GC", "format": "stableford"}, "players": [], "weeks": [], "money": [], "updatedAt": ""};               // data baked in at build time: the fallback copy
const BUILD = "v4.3 · 11-26";
const MONO = "<svg class=\"sp-mono\" role=\"img\" aria-label=\"TS\" viewBox=\"0 0 120 120\"><circle cx=\"60\" cy=\"60\" r=\"56\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"/><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"60\" y=\"74\" text-anchor=\"middle\" font-family=\"Charter,Georgia,serif\" font-weight=\"700\" font-size=\"42\" fill=\"currentColor\" letter-spacing=\"2\">TS<\/text><\/svg>";              // the monogram, inline SVG
let WORKER = String(CFG.worker_url || "").replace(/\/+$/, "");
const HOSTED = typeof location !== "undefined" && /^https?:$/.test(location.protocol);
const K = { auth:"ts.auth.v1", admin:"ts.admin.v1", q:"ts.queue.v1", srv:"ts.server.v1", local:"ts.localdoc.v1",
            hist:"ts.localhist.v1", a2:"ts.a2hs.v1", big:"ts.big.v1" };
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const jget = k => { try { return JSON.parse(lsGet(k) || "null"); } catch (e) { return null; } };
const jset = (k, v) => lsSet(k, JSON.stringify(v));
const isNum = v => typeof v === "number" && isFinite(v);
const $ = id => document.getElementById(id);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ======================= the data and saving ======================= */
/* Ops, applied exactly as the relay applies them (worker.js apply), minus the rules. */
function step(node, seg) {
  if (Array.isArray(node)) return node.find(x => x && (x.id === seg || String(x.n) === String(seg)));
  return node && typeof node === "object" ? node[seg] : undefined;
}
function applyOp(doc, op) {
  const p = op.path.map(String); let node = doc;
  for (let i = 0; i < p.length - 1; i++) {
    let next = step(node, p[i]);
    if (next === undefined) { if (Array.isArray(node)) throw new Error("missing " + p.join("/")); next = node[p[i]] = {}; }
    node = next;
  }
  const last = p[p.length - 1];
  if (op.op === "push") {
    let arr = step(node, last); if (arr === undefined && !Array.isArray(node)) arr = node[last] = [];
    arr.push(clone(op.value));
  } else if (Array.isArray(node)) {
    const i = node.findIndex(x => x && (x.id === last || String(x.n) === last));
    if (i < 0) throw new Error("missing " + p.join("/"));
    op.op === "del" ? node.splice(i, 1) : (node[i] = clone(op.value));
  } else if (op.op === "del") delete node[last];
  else node[last] = clone(op.value);
}
function valueAt(doc, path) { let n = doc; for (const s of path) { n = step(n, String(s)); if (n === undefined) return null; } return n; }

/* SRV = the last copy the server gave us (or the baked-in one). DOC = SRV + our unsaved changes. */
/* a fingerprint of the data baked into this page: any change to it (a rebuilt sample, a renamed
   course) starts the try-out copy afresh instead of keeping an old one */
const BASEKEY = (() => { const t = JSON.stringify(BASE); let h = 5381; for (let i = 0; i < t.length; i++) h = (h * 33 ^ t.charCodeAt(i)) >>> 0; return BASE.updatedAt + "|" + h.toString(36); })();
function loadSrv() {
  if (!WORKER) {                                        // trying it out: everything lives on this phone
    // the copy kept on this phone is only reused while it grew from exactly this build's data
    const l = jget(K.local);
    return l && l.doc && l.base === BASEKEY ? l : { doc: clone(BASE), sha: null, base: BASEKEY };
  }
  const s = jget(K.srv);
  return s && s.doc && String(s.doc.updatedAt || "") >= String(BASE.updatedAt || "") ? s : { doc: clone(BASE), sha: null };
}
let SRV = loadSrv();
let Q = (jget(K.q) || []).filter(x => x && Array.isArray(x.ops));
let DOC;
let flying = null, savingOff = false, noSignal = false, retryT = null, retryN = 0, lastPull = 0;
function norm(d) {
  d.players = Array.isArray(d.players) ? d.players : []; d.weeks = Array.isArray(d.weeks) ? d.weeks : [];
  d.money = Array.isArray(d.money) ? d.money : []; d.settings = d.settings || {};
  d.weeks.sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.id).localeCompare(String(b.id)));
  return d;
}
function view() {
  DOC = clone(SRV.doc);
  for (const it of Q) if (it.st !== "no") for (const op of it.ops) { try { applyOp(DOC, op); } catch (e) {} }
  norm(DOC);
}
view();
const persistQ = () => jset(K.q, Q);

let AUTH = jget(K.auth);                                 // {id, key} from the link, or {id, pin}
let ADMINPIN = lsGet(K.admin);
const ME = () => AUTH && AUTH.id && DOC.players.some(p => p.id === AUTH.id) ? AUTH.id : null;
/* The admin is a player: the relay's ADMINS list says who (it tells the app at sign-in).
   In try-out mode, config.json "admins" stands in for it. The admin PIN is the spare way in (#admin). */
/* names already set up on a phone (the relay keeps the list): they're left off "Who are you?" */
let CLAIMED = jget("ts.claimed.v1") || [], FREEP = jget("ts.free.v1") || [];
/* live: the relay sends only the names not yet set up (the scores stay private); try-out: from the data */
const free = () => (WORKER ? [...FREEP] : active().map(p => ({ id: p.id, name: p.name, nick: p.nick, set: CLAIMED.includes(p.id), pin: true })))
  .sort((a, b) => (a.nick || a.name).localeCompare(b.nick || b.name));
const lock = p => p.set ? `<small>🔒 your 4 numbers</small>` : "";
const ADMIN = () => !!ADMINPIN || !!(ME() && (WORKER ? AUTH.admin : (CFG.admins || []).includes(ME())));
const adminCred = () => ADMINPIN ? { pin: ADMINPIN } : AUTH.key ? { key: AUTH.key } : { by: AUTH.id, pin: AUTH.pin };
function cred(as) {
  if (as === "admin" && ADMINPIN) return { player: "admin", pin: ADMINPIN };
  if (AUTH && AUTH.key) return { key: AUTH.key };
  return { player: AUTH && AUTH.id, pin: AUTH && AUTH.pin };
}

/* save: queue some ops. ck groups repeat saves of the same thing (a card being typed),
   so only the latest is sent. */
function save(ops, label, ck) {
  const as = ADMIN() ? "admin" : "player";
  const ex = ck && Q.find(x => x.ck === ck && x.qid !== flying);
  if (ex) { ex.ops = ops; ex.st = "wait"; ex.why = ""; ex.as = as; }
  else Q.push({ qid: uid("q"), ops, label, ck: ck || "", st: "wait", as, t: Date.now() });
  persistQ(); view(); paint(); flush();
}
async function post(path, body) {
  const res = await fetch(WORKER + path, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  let j = {}; try { j = await res.json(); } catch (e) {}
  j.status = res.status; return j;
}
function plainWhy(r, as) {
  const e = String(r.error || "");
  if (r.status === 401) return as === "admin" ? "The admin PIN wasn't accepted. Go to Admin and put it in again."
    : "This phone isn't signed in any more (the admin may have reset it). Tap Me, then say who you are, or ask for your link.";
  if (/locked/i.test(e)) return "That week is finished and locked. Ask the admin.";
  if (r.status === 403) return "Only the admin can change that.";
  if (r.status === 400) return "Those numbers don't look right. Check them and put them in again.";
  if (r.status === 404) return "That week or player isn't there any more.";
  if (r.status === 409) return "That's already on the list, so it wasn't added twice.";
  return "It was turned down. Ask the admin.";
}
function later(ms) {
  clearTimeout(retryT);
  retryT = setTimeout(flush, ms || [3000, 6000, 15000, 30000, 60000][Math.min(retryN++, 4)]);
}
async function flush() {
  if (flying) return;
  const it = Q.find(x => x.st === "wait"); if (!it) return;
  if (!WORKER) { localApply(it); return flush(); }
  if ((it.as === "player" && !AUTH) || (it.as === "admin" && !ADMIN())) {
    it.st = "no"; it.why = it.as === "admin" ? "Go to Admin and put in the admin PIN." : "Tap Me and say who you are first.";
    persistQ(); view(); paint(); return flush();
  }
  flying = it.qid; paint();
  let r; try { r = await post("/write", Object.assign(cred(it.as), { ops: it.ops })); } catch (e) { r = { net: true }; }
  flying = null;
  if (r.ok) {
    SRV = { doc: r.doc, sha: r.sha }; jset(K.srv, SRV);
    Q = Q.filter(x => x !== it); savingOff = false; noSignal = false; retryN = 0;
  } else if (r.net || r.status === 503 || r.status === 429) { noSignal = !!r.net; later(); }
  else if (r.status >= 500) { savingOff = true; later(60000); }
  else { it.st = "no"; it.why = plainWhy(r, it.as); }
  persistQ(); view(); paint(); softRender();
  if (r.ok || it.st === "no") flush();
}
/* trying it out (no relay yet): the same rules, applied on this phone */
function localApply(it) {
  const d = clone(SRV.doc), hist = jget(K.hist) || [];
  try {
    for (const op of it.ops) {
      const p = op.path.map(String);
      if (it.as !== "admin") {
        const w = p[0] === "weeks" ? step(d.weeks, p[1]) : null;
        if (w && w.locked) throw { status: 403, error: "locked" };
        const ok = op.op === "set" && ((p.length === 4 && p[0] === "weeks" && (p[2] === "cards" || p[2] === "hcp") && p[3] === ME())
          || (p.length === 3 && p[0] === "players" && p[1] === ME() && p[2] === "hcp") || (p.length === 4 && p[0] === "weeks" && (p[2] === "age" || p[2] === "avail") && p[3] === ME()) || (p.length === 3 && p[0] === "players" && p[1] === ME() && (p[2] === "nick" || p[2] === "age" || p[2] === "name")));
        if (!ok) throw { status: 403 };
      }
      applyOp(d, op);
      hist.push({ t: new Date().toISOString(), who: it.as === "admin" && (ADMINPIN || !ME()) ? "Admin" : (P(ME()).name || "?"), path: p, value: op.op === "del" ? null : op.value });
    }
    d.updatedAt = new Date().toISOString();
    SRV = { doc: d, sha: null, base: BASEKEY }; jset(K.local, SRV); jset(K.hist, hist.slice(-400));
    Q = Q.filter(x => x !== it);
  } catch (e) { it.st = "no"; it.why = plainWhy(e, it.as); }
  persistQ(); view(); paint(); softRender();
}
async function pull() {
  if (!WORKER) return;
  const c = ADMINPIN ? { player: "admin", pin: ADMINPIN } : AUTH && AUTH.key ? { key: AUTH.key } : AUTH && AUTH.pin ? { player: AUTH.id, pin: AUTH.pin } : null;
  if (!c) return;                                       // the scores are private: nothing to fetch until signed in
  lastPull = Date.now();
  try {
    const res = await fetch(WORKER + "/data", { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(c), cache: "no-store" });
    if (res.status >= 500) { savingOff = true; paint(); return; }
    if (res.status === 401 && AUTH && !ADMINPIN) { signedOut(); return; }
    const j = await res.json();
    // GitHub can hand back a copy a few seconds old (from before our own last save): never go backwards
    if (j && j.doc && String(j.doc.updatedAt || "") >= String((SRV.doc && SRV.doc.updatedAt) || "")) { SRV = { doc: j.doc, sha: j.sha }; jset(K.srv, SRV); noSignal = false; view(); softRender(); paint(); }
    else if (j && j.doc) noSignal = false;
  } catch (e) { noSignal = true; paint(); }
}

/* ======================= players, weeks ======================= */
const P = id => DOC.players.find(p => p.id === id) || FREEP.find(p => p.id === id) || { id, name: id || "", hcp: 0 };
const nm = id => { const p = P(id); return p.nick || p.name; };
const active = () => DOC.players.filter(p => p.active !== false).sort((a, b) => nm(a.id).localeCompare(nm(b.id)));
const WK = id => DOC.weeks.find(w => w.id === id);
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
// UK style everywhere: 07 Nov 26, 24-hour clock.
const p2 = n => String(n).padStart(2, "0");
const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* DD MMM YY: "07 Nov 26"; long adds the day ("Saturday 07 Nov 26"); noYr drops the year, for
   screens about one week, where the year goes without saying (Justin, 08-11-2026). */
function fmtDate(s, long, noYr) {
  s = String(s || ""); if (s.length < 10) return s;
  const d = new Date(s.slice(0, 10) + "T12:00:00");
  return (long ? DAYS[d.getDay()] + " " : "") + p2(d.getDate()) + " " + MON3[d.getMonth()] + (noYr ? "" : " " + String(d.getFullYear()).slice(2));
}
const fmtTime = d => p2(d.getHours()) + ":" + p2(d.getMinutes());
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function nextSaturday() { const d = new Date(); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7));
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
const MED = w => w.format === "gross";
/* Thorpe Hall GC, yellow and white tees: pars from The Social Golfer (11-2026); stroke indexes as corrected
   by Justin 08-11-2026 (holes 4 and 7 swapped about a year ago: 4 is now 17, 7 is now 13). Par 71: 35 out, 36 in. Thorpe Hall GC is the only course (Justin: "exclusively"). */
const HALL = { par: [4, 4, 3, 5, 3, 4, 3, 5, 4, 4, 5, 4, 3, 5, 4, 3, 4, 4], si: [9, 5, 15, 17, 7, 1, 13, 3, 11, 10, 14, 2, 18, 8, 6, 12, 4, 16] };
const HOME = "Thorpe Hall GC";
const okArr = a => Array.isArray(a) && a.length === 18 && a.every(isNum);
const CARD = () => { const c = DOC.settings.card || {}; return { par: okArr(c.par) ? c.par : HALL.par, si: okArr(c.si) ? c.si : HALL.si }; };
const sum = a => a.reduce((x, y) => x + y, 0);
/* shots a handicap gets on a hole (a plus handicap gives them back on the easiest holes) */
const shotsOn = (H, si) => { const b = Math.floor(H / 18), r = H - 18 * b; return b + (si <= r ? 1 : 0); };
const homeCourse = () => true;                          // every week is at Thorpe Hall GC
/* Gross strokes, worked out from Stableford points and that day's handicap. A hole's points are
   2 + par + shots - strokes, so a nine's strokes are its par + shots + 18 - points. A hole with no
   points counts as a net double bogey, the same as the official adjusted score. Medal weeks: as typed. */

      save(ops, nm(d.p) + ": added to the week"); toast(nm(d.p) + " added"); return render(); }
    case "gwa": { const G = groupsOf(w).filter(g => g.players.length), un = unplaced(w);
      const msg = `${CFG.app_name}: ${fmtDate(w.date, true, true)}, ${HOME}\n\n` + G.map((g, i) => `${g.tee || "Group " + (i + 1)}: ${g.players.map(nm).join(", ")}`).join("\n")
        + (un.length ? `\n\nStill to place: ${un.map(nm).join(", ")}` : "") + (CFG.live_url ? `\n\nCan't make it? Say so in the app: ${CFG.live_url}` : "");
      $("gwaBox").innerHTML = `<div class="panel"><p><b>The groups message is ready.</b> Tap the button, pick the Shankers chat, then press send.</p>
        <a class="btn main" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Open WhatsApp</a>
        <pre class="gmsg">${esc(msg)}</pre></div>`; return; }
    case "avail": { const tw = thisWeek() && !thisWeek().locked ? thisWeek() : null; if (!tw || !ME()) return;
      save([set(["weeks", tw.id, "avail", ME()], !!d.on)], d.on ? "I can play" : "I can't make it");
      toast(d.on ? "Great, you're down to play" : "Thanks. You're out this week"); return render(); }
    case "sort": R.s = d.s; try { history.replaceState(R, ""); } catch (e) {} return render();
    case "stick": { const i = DRAFT.players.indexOf(d.p); i >= 0 ? DRAFT.players.splice(i, 1) : DRAFT.players.push(d.p); return render(); }
    case "slast": { const l = lastWeek(); DRAFT.players = [...((l && (l.players && l.players.length ? l.players : entrants(l))) || [])].filter(id => P(id).active !== false); return render(); }
    case "snone": DRAFT.players = []; return render();
    case "ssave": {
      const D = DRAFT; if (!D.date) return toast("Put in the date");
      const order = DOC.players.map(p => p.id), pl = [...D.players].sort((a, b) => order.indexOf(a) - order.indexOf(b));
      if (D.for === "new") {
        let id = "w" + D.date, n = 2; while (WK(id)) id = "w" + D.date + "-" + n++;
        const wk = { id, date: D.date, course: HOME, format: D.format, players: pl, hcp: {}, ...(D.tee ? { tee: D.tee } : {}),
          twos: isNum(DOC.settings.twos) ? DOC.settings.twos : 0, prizes: clone(DOC.settings.prizes || { overall: 50, front: 25, back: 25 }), cards: {}, locked: false };
        save([{ op: "push", path: ["weeks"], value: wk }], "New week " + fmtDate(D.date)); DRAFT = null; toast("Week saved"); return go("week", { w: id });
      }
      const ex = WK(D.for);
      const ops = [set(["weeks", ex.id, "date"], D.date), set(["weeks", ex.id, "course"], HOME), set(["weeks", ex.id, "format"], D.format),
        set(["weeks", ex.id, "players"], pl), D.tee ? set(["weeks", ex.id, "tee"], D.tee) : { op: "del", path: ["weeks", ex.id, "tee"] }];
      save(ops, "Week " + fmtDate(D.date)); DRAFT = null; toast("Saved"); return go("week", { w: ex.id });
    }
    case "hyes": saveH(w, R.p, isNum((w.hcp || {})[R.p]) ? w.hcp[R.p] : P(R.p).hcp); R.hchg = 0; return render();
    case "hchg": R.hchg = 1; R.adj = null; return render();
    case "adjyes": { const a = R.adj, c = cardOf(w, R.p); if (!a || !c) return render();
      const nc = adjCard(c, hcpShift(a.from, a.to)); R.adj = null;
      save([set(["weeks", w.id, "cards", R.p], nc)], nm(R.p) + "'s points, after the handicap change"); toast("Points put right"); return render(); }
    case "adjno": R.adj = null; return render();
    case "hkeep": R.hchg = 0; if (!hcpChecked(w, R.p)) saveH(w, R.p, P(R.p).hcp); return render();
    case "hsave": case "h1save": case "myhsave": {
      const inp = $(a === "myhsave" ? "myH" : "hIn"), h = parseH(inp && inp.value);
      if (h == null) { $("hMsg").innerHTML = `<div class="hint">Put in the playing handicap, a whole number between +10 and 54, like 16.</div>`; return; }
      if (a === "hsave") {
        const from = playH(w, R.p), c = cardOf(w, R.p);
        saveH(w, R.p, h); R.hchg = 0;
        if (c && !MED(w) && from !== Math.round(h) && hcpShift(from, Math.round(h)).holes.length) R.adj = { w: w.id, p: R.p, from, to: Math.round(h) };
        return render(); }
      saveH(null, ME(), h); toast("Saved");
      return a === "h1save" ? afterSignIn() : render(); }
    case "putback": { const v = JSON.parse(d.v); save([set(["weeks", R.w, "cards", R.p], v)], nm(R.p) + "'s card, put back"); HIST = null; toast("Put back"); return render(); }
  }
}
async function sendLink(id) {
  const p = P(id); let key;
  if (WORKER) { let r; try { r = await post("/admin/make-link", Object.assign(adminCred(), { player: id })); } catch (e) { r = {}; }
    if (!r.ok) return toast("Couldn't make the link just now. Try again."); key = r.key; }
  else key = "TRYOUTLINK" + id.toUpperCase().replace(/[^A-Z0-9]/g, "") + "0000000";
  const base = CFG.live_url || location.href.split("#")[0];
  const msg = `Hello ${p.name.split(" ")[0]}, here is your own link for ${CFG.app_name}. Tap it once and your phone is set up for good, nothing to type:\n${base}#k=${key}`;
  $("linkBox").innerHTML = `<div class="panel"><p><b>The message is ready.</b> Tap the button, pick ${esc(p.name.split(" ")[0])} in WhatsApp, then press send.</p>
    <a class="btn main" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Open WhatsApp</a>
    <p class="note">No phone numbers are kept in the app. This link replaces any old one.</p></div>`;
}
let PENDING = null;
/* the admin reset this man's sign-in (or his link was replaced): off this phone, back to "Who are you?" */
function signedOut() {
  AUTH = null; lsDel(K.auth); lsDel(K.srv);
  post("/claimed", {}).then(r => { if (r.ok) { CLAIMED = r.ids; FREEP = r.free || []; jset("ts.claimed.v1", CLAIMED); jset("ts.free.v1", FREEP); } }).catch(() => {}).then(() => {
    if (splashUp) buildSplash(); else go("who"); toast("Your sign-in was reset. Tap your name to set up again."); });
}
function afterSignIn() {
  if (WORKER && AUTH && AUTH.key && !AUTH.pinSet && !lsGet("ts.pinasked.v1") && R.v !== "mypin") return go("mypin");
  if (ME() && !isNum(P(ME()).hcp) && !(PENDING && PENDING.w) && R.v !== "hcp1") return go("hcp1");
  if (PENDING && PENDING.w) { const w = PENDING.w; PENDING = null; return go("card", { w, p: ME() }); }
  if (PENDING && PENDING.pick) { const w = PENDING.pick; PENDING = null; return go("pick", { w }); }
  if (shouldA2()) return go("a2");
  go("home");
}
const standalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const shouldA2 = () => HOSTED && !standalone() && !lsGet(K.a2);
function applyBig() { const n = +(lsGet(K.big) || 0); document.documentElement.classList.toggle("big1", n === 1); document.documentElement.classList.toggle("big2", n === 2); }

/* ======================= the splash ======================= */
const splashEl = $("splash"), splash2 = $("splash2");
let splashUp = true, splashT = null;
function buildSplash() {
  const me = ME();
  let h = `<div class="in">${MONO}<div class="sp-t">${esc(CFG.app_name)}</div>${CFG.tagline ? `<div class="sp-tag">${esc(CFG.tagline)}</div>` : ""}${jibe() ? `<div class="sp-jibe">${esc(jibe())}</div>` : ""}`;
  if (me || ADMIN()) h += `<div class="sp-hi">Hello, ${esc(me ? nm(me) : (CFG.admin_name || "admin"))}</div><button class="btn main" data-sp="in">Go in</button>`;
  else { const f = free();
    h += f.length ? `<div class="sp-q">Who are you?</div><div class="who">${f.map(p => `<button data-sp="iam" data-p="${esc(p.id)}">${esc(p.nick || p.name)}${lock(p)}</button>`).join("")}</div>
      <div class="sp-tag">🔒 already set up: tap it and put in your 4 numbers.</div>`
      : `<div class="sp-q">Everyone on the list is set up.</div><div class="sp-tag">New to the Shankers? Ask the admin to add you and send your link.</div>`;
    if (!WORKER) h += `<button class="btn quiet" data-sp="look">Just looking</button>`; }
  splashEl.innerHTML = h + `</div>`;
}
function leaveSplash(then) {
  if (!splashUp) return; splashUp = false; clearTimeout(splashT);
  splashEl.classList.add("gone");
  if (splash2) { splash2.classList.remove("gone"); setTimeout(() => splash2.classList.add("gone"), 3500); }
  then ? then() : (shouldA2() && (ME() || ADMIN()) ? go("a2") : render());
}
if (splash2) splash2.addEventListener("click", () => splash2.classList.add("gone"));
splashEl.addEventListener("click", e => {
  const b = e.target.closest("[data-sp]"); if (!b) return;
  const k = b.dataset.sp;
  if (k === "in" || k === "look") leaveSplash();
  else if (k === "admin") leaveSplash(() => go("admin"));
  else if (k === "iam") leaveSplash(() => act("iam", { p: b.dataset.p }));
});

/* ======================= start ======================= */
async function boot() {
  applyBig();
  try { history.replaceState(R, ""); } catch (e) {}
  const m = String(location.hash || "").match(/[#&]k=([A-Za-z0-9]{16,64})/);
  if (m) {                                               // the personal link from WhatsApp
    try { history.replaceState(R, "", location.pathname + location.search); } catch (e) {}
    if (WORKER) {
      let r; try { r = await post("/login", { key: m[1] }); } catch (e) { r = { net: true }; }
      if (r.ok && r.id) { AUTH = { id: r.id, key: m[1], admin: r.role === "admin" }; jset(K.auth, AUTH); if (!SRV.doc.players.some(p => p.id === r.id)) await pull(); }
      else if (r.net) { AUTH = { id: null, key: m[1] }; }   // no signal: keep the key, sort out who on the next read
      else toast("That link has been replaced. Ask the admin for a new one.");
    } else {
      const id = (DOC.players.find(p => m[1] === "TRYOUTLINK" + p.id.toUpperCase().replace(/[^A-Z0-9]/g, "") + "0000000") || {}).id;
      if (id) { AUTH = { id }; jset(K.auth, AUTH); }
    }
  }
  if (/^#admin$/.test(location.hash || "")) { R = { v: "admin" }; try { history.replaceState(R, "", location.pathname + location.search); } catch (e) {} }
  buildSplash(); render();
  if (HOSTED || WORKER) { loadWx(); setInterval(() => { if (document.visibilityState === "visible") loadWx(); }, 30 * 60e3); }
  if (ME() || ADMIN()) splashT = setTimeout(() => leaveSplash(), 2500);
  if (WORKER && !ME()) post("/claimed", {}).then(r => { if (r.ok && Array.isArray(r.ids)) { CLAIMED = r.ids; FREEP = r.free || []; jset("ts.claimed.v1", CLAIMED); jset("ts.free.v1", FREEP); if (splashUp && !ME()) buildSplash(); if (R.v === "who") render(); } }).catch(() => {});
  if (WORKER) {
    /* ask the relay who this phone is, so the admin is the admin (and stops being one if Justin takes him off the list) */
    pull().then(() => { if (AUTH && (AUTH.key || AUTH.pin)) post("/login", AUTH.key ? { key: AUTH.key } : { player: AUTH.id, pin: AUTH.pin, check: true })
      .then(r => { if (r.ok) { AUTH.id = r.id || AUTH.id; AUTH.admin = r.role === "admin"; jset(K.auth, AUTH); render(); }
        else if (r.status === 401) signedOut(); }).catch(() => {}); });
    flush();
    const live = () => { const w = thisWeek(); return w && Math.abs(new Date(w.date + "T12:00:00") - Date.now()) < 36e5 * 30; };
    setInterval(() => { if (document.visibilityState === "visible" && Date.now() - lastPull > (live() ? 30000 : 60000)) pull(); }, 10000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { pull(); flush(); } });
    window.addEventListener("focus", () => { if (Date.now() - lastPull > 10000) pull(); });
    window.addEventListener("online", () => { retryN = 0; flush(); pull(); });
  } else flush();
  if (HOSTED && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
boot();

</script>
